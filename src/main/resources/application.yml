server:
  port: ${APPOINTMENTS_SERVER_PORT:8084}

spring:
  application:
    name: mercado-x-appointments
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mercado_x}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/public.pem}

google:
  calendar:
    oauth:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI}
      state-ttl: ${GOOGLE_OAUTH_STATE_TTL:10m}
      allowed-return-paths:
        - /settings/appointments/integrations
